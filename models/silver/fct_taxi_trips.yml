version: 2

models:
  - name: fct_taxi_trips

    description: "Cleaned and incrementally loaded NYC taxi trip data."

    columns:

      - name: trip_id
        description: "Unique identifier for a taxi trip."
        tests:
          - not_null
          - unique

      - name: pickup_datetime
        description: "Taxi pickup timestamp."
        tests:
          - not_null

      - name: dropoff_datetime
        description: "Taxi dropoff timestamp."
        tests:
          - not_null

      - name: trip_distance
        description: "Distance travelled by the taxi."
        tests:
          - not_null

      - name: total_amount
        description: "Total amount charged for the trip."
        tests:
          - not_null